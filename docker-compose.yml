# Local Postgres for Vspomni Nest/Prisma (isolated from Miraflores :5432 and Saleor).
services:
  db:
    image: postgres:16-alpine
    container_name: vspomni_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: vspomni
      POSTGRES_USER: vspomni
      POSTGRES_PASSWORD: vspomni
    volumes:
      - vspomni_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vspomni -d vspomni"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vspomni_pg:
