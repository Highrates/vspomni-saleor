services:
  db:
    image: postgres:16-alpine
    container_name: saleor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-saleor}
      POSTGRES_USER: ${DB_USER:-saleor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-saleor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saleor_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.19.0
    container_name: saleor_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # Web UI (только localhost)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saleor_api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    entrypoint: ["/app/docker-entrypoint.sh"]

    command:
      [
        "uvicorn",
        "saleor.asgi:application",
        "--host=0.0.0.0",
        "--port=8000",
        "--workers=2"
      ]

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-saleor}
      DB_NAME: ${DB_NAME:-saleor}
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - static_files:/app/static
      - media_files:/app/media


  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saleor_celery_worker
    restart: unless-stopped
    command:
      ["celery", "-A", "saleor", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-saleor}
      DB_NAME: ${DB_NAME:-saleor}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media

  dashboard:
    build:
      context: ./saleor-dashboard
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
        APP_MOUNT_URI: /dashboard/
        STATIC_URL: /dashboard/
        SKIP_SOURCEMAPS: "true"
    container_name: saleor_dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:80" # Dashboard доступен только для nginx на localhost
    environment:
      API_URL: ${API_URL}
      APP_MOUNT_URI: /dashboard/
      STATIC_URL: /dashboard/
    depends_on:
      - api

volumes:
  postgres_data:
  static_files:
  media_files:
