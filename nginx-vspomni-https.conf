# Nginx для vspomni.store (фронт + Saleor API + dashboard)
# Скопировать: sudo cp nginx-vspomni-https.conf /etc/nginx/sites-available/vspomni
# Включить:   sudo ln -sf /etc/nginx/sites-available/vspomni /etc/nginx/sites-enabled/
# Проверить:  sudo nginx -t && sudo systemctl reload nginx

upstream saleor_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream saleor_dashboard {
    server 127.0.0.1:3030;
    keepalive 32;
}

upstream vspomni_front {
    server 127.0.0.1:3001;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=graphql_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name vspomni.store www.vspomni.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vspomni.store www.vspomni.store;

    # Обязательно для загрузки MP4/фото в админке (GraphQL fileUpload)
    client_max_body_size 100M;

    ssl_certificate /etc/nginx/ssl/vspomni.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/vspomni.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/vspomni_access.log;
    error_log /var/log/nginx/vspomni_error.log;

    location /graphql/ {
        client_max_body_size 100M;
        limit_req zone=graphql_limit burst=20 nodelay;

        proxy_pass http://saleor_api/graphql/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /dashboard/ {
        proxy_pass http://saleor_dashboard/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /static/ {
        alias /var/lib/docker/volumes/vspomni_static_files/_data/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/lib/docker/volumes/vspomni_media_files/_data/;
        expires 7d;
        access_log off;
    }

    # Next.js API routes (прокси на фронт; на проде без этого /api/* может уходить в Saleor)
    location ~ ^/api/(cdek|yandex-delivery|yookassa|saleor|ozon-delivery)/ {
        proxy_pass http://vspomni_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Saleor custom REST: ^~ выше regex и location /
    # (иначе Next.js ловит /checkout/* и отвечает 308)
    location ^~ /checkout/create-without-stock-check {
        proxy_pass http://saleor_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ^~ /checkout/complete-without-stock-check {
        proxy_pass http://saleor_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ^~ /checkout/apply-external-shipping {
        proxy_pass http://saleor_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ^~ /api/checkout/ {
        proxy_pass http://saleor_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Auth REST + voucher validation (ЛК, login, orders)
    location ^~ /auth/ {
        proxy_pass http://saleor_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /voucher/validate/ {
        proxy_pass http://saleor_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://vspomni_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
