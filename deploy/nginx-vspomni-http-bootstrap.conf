# Временный HTTP-only server для первого Let’s Encrypt (до появления сертификатов).
# После certbot заменить на nginx-vspomni-https.conf.
#
#   sudo cp deploy/nginx-vspomni-http-bootstrap.conf /etc/nginx/sites-available/vspomni
#   sudo ln -sf /etc/nginx/sites-available/vspomni /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vspomni.store -d www.vspomni.store

upstream vspomni_api {
    server 127.0.0.1:3011;
    keepalive 32;
}

upstream vspomni_front {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream vspomni_admin {
    server 127.0.0.1:3020;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name vspomni.store www.vspomni.store;

    client_max_body_size 12M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/v1/ {
        proxy_pass http://vspomni_api/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://vspomni_api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Next assets (assetPrefix=/_va → /_va/_next/* → upstream /_next/*)
    location /_va/_next/ {
        proxy_pass http://vspomni_admin/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Admin Next BFF (login/session/backend) — иначе /api/* уходит во Front → 404
    location /api/admin/ {
        proxy_pass http://vspomni_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /admin {
        proxy_pass http://vspomni_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/api/(cdek|yandex-delivery|yookassa|ozon-delivery)/ {
        proxy_pass http://vspomni_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /graphql/ { return 410; }
    location /dashboard/ { return 410; }

    location / {
        proxy_pass http://vspomni_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
