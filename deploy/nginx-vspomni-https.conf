# Nginx for vspomni.store — Nest stack on NEW VPS (/opt/vspomni).
# After Let’s Encrypt: sudo cp …/nginx-vspomni-https.conf /etc/nginx/sites-available/vspomni
# First boot (no certs yet): use nginx-vspomni-http-bootstrap.conf + certbot.
# See deploy/NEW-VPS.md
#
# Upstream (systemd on same host):
#   Front Next  127.0.0.1:3001  vspomni-front
#   Nest API    127.0.0.1:3011  vspomni-api
#   Admin Next  127.0.0.1:3020  vspomni-admin

# Throttler Nest — in-memory per process; nginx limit_req — edge rate limit.
limit_req_zone $binary_remote_addr zone=vsp_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vsp_promo:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=vsp_webhook:10m rate=60r/m;

# Access log без query string (не светить ?secret=).
log_format vspomni_main '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

# Header предпочтительнее; ?secret= → тот же header (в лог URI без args).
map $http_x_yookassa_webhook_secret $vsp_yk_secret {
    ""      $arg_secret;
    default $http_x_yookassa_webhook_secret;
}

upstream vspomni_api {
    server 127.0.0.1:3011;
    keepalive 32;
}

upstream vspomni_front {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream vspomni_admin {
    server 127.0.0.1:3020;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name vspomni.store www.vspomni.store;
    # ACME HTTP-01 (certbot renew) до редиректа на HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vspomni.store www.vspomni.store;

    # Каталог / сертификаты: хватит 12M; не 100M.
    client_max_body_size 12M;

    # Let’s Encrypt (certbot). До первого выпуска — self-signed:
    #   ssl_certificate     /etc/ssl/vspomni/fullchain.pem;
    #   ssl_certificate_key /etc/ssl/vspomni/privkey.pem;
    ssl_certificate /etc/letsencrypt/live/vspomni.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vspomni.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/vspomni_access.log vspomni_main;
    error_log /var/log/nginx/vspomni_error.log;

    # Security headers (HSTS только на HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Auth — строже (OTP / login / reset)
    location ^~ /api/v1/auth/ {
        limit_req zone=vsp_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://vspomni_api/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Promo validate
    location = /api/v1/promo/validate {
        limit_req zone=vsp_promo burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://vspomni_api/api/v1/promo/validate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # YooKassa webhook: ?secret → header; upstream без query; access_log без $args
    location = /api/v1/orders/yookassa/webhook {
        limit_req zone=vsp_webhook burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header X-Yookassa-Webhook-Secret $vsp_yk_secret;
        # `?` в конце — не пробрасывать query string на Nest
        proxy_pass http://vspomni_api/api/v1/orders/yookassa/webhook?;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Nest API (остальное)
    location /api/v1/ {
        proxy_pass http://vspomni_api/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Nest local uploads
    location /uploads/ {
        proxy_pass http://vspomni_api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        expires 7d;
        access_log off;
    }

    # Admin Next assets (assetPrefix=/_va → /_va/_next/* → upstream /_next/*)
    # Do not use /admin as assetPrefix: it collides with App Router /admin/* pages.
    location /_va/_next/ {
        proxy_pass http://vspomni_admin/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Admin public/ (дефолтный аватар и пр.) — иначе /images/* уходит во Front → 404
    location /_va/images/ {
        proxy_pass http://vspomni_admin/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Admin Next BFF (login/session/backend proxy) — иначе /api/* уходит во Front → 404
    location /api/admin/ {
        proxy_pass http://vspomni_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Admin panel
    location /admin {
        proxy_pass http://vspomni_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Front Next BFF (CDEK / Yandex / Ozon / YooKassa webhook proxy)
    location ~ ^/api/(cdek|yandex-delivery|yookassa|ozon-delivery)/ {
        proxy_pass http://vspomni_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gone: только явные Saleor-поверхности (bookmarks / боты).
    location /graphql/ { return 410; }
    location /dashboard/ { return 410; }

    location / {
        proxy_pass http://vspomni_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
